name: Test proposed package input with upstream Linux emulation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TREE: cee46918c995cfe3b143313200cfb435ede088b2
    steps:
    - name: Use identical checkout settings across runner operating systems
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: pypa/cibuildwheel
        ref: 92df0b4d63600b933002d1697a4dda4fc3afd723
        path: candidate
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Verify proposed git tree
      env:
        PATCH: 
        PATCH_HASH: abf62d5436296ee2dbe00eb403b8f632206613d449ef0bc112b4974c2ce6e294
      shell: python
      run: "import base64, hashlib, os, shutil, subprocess, tarfile, urllib.request\nfrom pathlib import Path\nroot = Path.cwd()\npatch = base64.b64decode(os.environ[\"\
        PATCH\"], validate=True)\nassert hashlib.sha256(patch).hexdigest() == os.environ[\"PATCH_HASH\"]\ndef git(*args, **kw):\n    return subprocess.check_output([\"\
        git\",\"-C\",\"candidate\",*args], **kw)\ngit(\"apply\",\"--cached\",\"-\",input=patch)\nassert git(\"write-tree\").decode().strip() == os.environ[\"\
        TREE\"]\ngit(\"checkout-index\",\"-a\",\"-f\")\nassert git(\"diff\",\"--exit-code\") == b\"\"\n"
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        enable-cache: false
    - name: Set up foreign architecture emulation
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
    - name: Install locked test group
      working-directory: candidate
      run: uv sync --locked --no-dev --group test
    - name: Run doctests
      working-directory: candidate
      run: uv run --no-sync pytest cibuildwheel --junitxml=doctests.xml
    - name: Run Docker-enabled unit suite
      working-directory: candidate
      run: uv run --no-sync pytest unit_test --run-docker --junitxml=unit.xml
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: docker-suite
        path: candidate/*.xml
        if-no-files-found: warn
