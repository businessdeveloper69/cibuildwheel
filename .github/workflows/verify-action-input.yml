name: Verify package input on real MarkupSafe wheels
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          ident: cp313-win_amd64
        - os: macos-15
          ident: cp313-macosx_arm64
        - os: ubuntu-24.04
          ident: cp313-manylinux_x86_64
    env:
      TREE: cee46918c995cfe3b143313200cfb435ede088b2
      CIBW_TEST_COMMAND: python -c "import markupsafe; from markupsafe import _speedups; assert str(markupsafe.escape(chr(38))) == chr(38) + 'amp;'; print(_speedups.__file__)"
    steps:
    - name: Use identical checkout settings across runner operating systems
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: pypa/cibuildwheel
        ref: 92df0b4d63600b933002d1697a4dda4fc3afd723
        path: baseline
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: pypa/cibuildwheel
        ref: 92df0b4d63600b933002d1697a4dda4fc3afd723
        path: candidate
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Verify proposed tree and prepare two real source distributions
      shell: python
      env:
        PATCH: 
        PATCH_HASH: abf62d5436296ee2dbe00eb403b8f632206613d449ef0bc112b4974c2ce6e294
      run: |-
        import base64, hashlib, os, shutil, subprocess, tarfile, urllib.request
        from pathlib import Path
        root = Path.cwd()
        patch = base64.b64decode(os.environ["PATCH"], validate=True)
        assert hashlib.sha256(patch).hexdigest() == os.environ["PATCH_HASH"]
        def git(*args, **kw):
            return subprocess.check_output(["git","-C","candidate",*args], **kw)
        git("apply","--cached","-",input=patch)
        assert git("write-tree").decode().strip() == os.environ["TREE"]
        git("checkout-index","-a","-f")
        assert git("diff","--exit-code") == b""
        srcdir = root / "input files"
        srcdir.mkdir()
        for v, path, digest in [
            ("3.0.2","b2/97/5d42485e71dfc078108a86d6de8fa46db44a1a9295e89c5d6d4a06e23a62","ee55d3edf80167e48ea11a923c7386f4669df67d7994554387f84e7d8b0a2bf0"),
            ("3.0.3","7e/99/7690b6d4034fffd95959cbe0c02de8deb3098cc577c67bb6a24fe5d7caa7","722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698"),
        ]:
            filename = f"markupsafe-{v}.tar.gz"
            data = urllib.request.urlopen("https://files.pythonhosted.org/packages/"+path+"/"+filename).read()
            assert hashlib.sha256(data).hexdigest() == digest
            local = srcdir / filename
            local.write_bytes(data)
            with tarfile.open(local) as arc:
                arc.extractall(srcdir,filter="data")
            if v=="3.0.2":
                shutil.copytree(srcdir/f"markupsafe-{v}",root,dirs_exist_ok=True)
        (root/"verification.toml").write_text('[tool.cibuildwheel]\nbuild-frontend = "pip"\n')
    - name: upstream-fallback
      uses: ./baseline
      with:
        package: input files/markupsafe-3.0.3.tar.gz
        only: ${{ matrix.ident }}
        config-file: verification.toml
        output-dir: built/upstream-fallback
    - name: new-archive
      uses: ./candidate
      with:
        package: input files/markupsafe-3.0.3.tar.gz
        only: ${{ matrix.ident }}
        config-file: verification.toml
        output-dir: built/new-archive
    - name: new-directory
      uses: ./candidate
      with:
        package: input files/markupsafe-3.0.3
        only: ${{ matrix.ident }}
        config-file: verification.toml
        output-dir: built/new-directory
    - name: legacy-archive
      uses: ./candidate
      with:
        package-dir: input files/markupsafe-3.0.3.tar.gz
        only: ${{ matrix.ident }}
        config-file: verification.toml
        output-dir: built/legacy-archive
    - name: legacy-directory
      uses: ./candidate
      with:
        package-dir: input files/markupsafe-3.0.3
        only: ${{ matrix.ident }}
        config-file: verification.toml
        output-dir: built/legacy-directory
    - name: no-input
      uses: ./candidate
      with:
        only: ${{ matrix.ident }}
        config-file: verification.toml
        output-dir: built/no-input
    - name: precedence
      uses: ./candidate
      with:
        package: input files/markupsafe-3.0.3.tar.gz
        package-dir: missing directory
        only: ${{ matrix.ident }}
        config-file: verification.toml
        output-dir: built/precedence
    - name: Verify selected versions and native extensions in every wheel
      shell: python
      env:
        EXPECTED: '{"upstream-fallback": "3.0.2", "new-archive": "3.0.3", "new-directory": "3.0.3", "legacy-archive": "3.0.3", "legacy-directory": "3.0.3",
          "no-input": "3.0.2", "precedence": "3.0.3"}'
      run: |-
        import email, hashlib, json, os, zipfile
        from pathlib import Path
        rows = []
        for case, expected in json.loads(os.environ["EXPECTED"]).items():
            wheel, = Path("built",case).glob("*.whl")
            with zipfile.ZipFile(wheel) as z:
                names = z.namelist()
                metadata, = [name for name in names if name.endswith(".dist-info/METADATA")]
                version = email.message_from_bytes(z.read(metadata))["Version"]
                ext, = [name for name in names if "_speedups" in name and name.endswith((".pyd",".so"))]
                assert version == expected, (case, version, expected)
                assert wheel.name.startswith("markupsafe-"+version+"-cp313-"), wheel.name
            rows.append({"case":case, "version":version, "wheel":wheel.name,"extension":ext,"sha256":hashlib.sha256(wheel.read_bytes()).hexdigest()})
        out={"runner":os.environ["RUNNER_OS"],"expected_tree":os.environ["TREE"],"wheels":rows}
        Path("native-results.json").write_text(json.dumps(out,indent=2))
        print(json.dumps(out, indent=2))
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-${{ runner.os }}
        path: native-results.json
        if-no-files-found: error
